AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Tech Challenge FIAP Fase 2 - Pipeline de ingestao streaming.
  Cria o Kinesis Data Stream, a role IAM e o Lambda consumer que grava
  os eventos na camada bronze do data lake em S3, particionados por ano.

Parameters:
  NomeBucketDataLake:
    Type: String
    Description: >
      Nome do bucket S3 do data lake (ja existente) onde a camada bronze
      recebe os eventos de streaming.

  NomeStream:
    Type: String
    Default: fiap-alfabetizacao-stream
    Description: Nome do Kinesis Data Stream.

  CodigoS3Bucket:
    Type: String
    Description: Bucket S3 onde esta o zip do codigo do Lambda consumer.

  CodigoS3Key:
    Type: String
    Default: infra/consumer_lambda.zip
    Description: Chave S3 do zip do codigo do Lambda consumer.

Resources:
  StreamAlfabetizacao:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Ref NomeStream
      # 1 shard provisionado: suficiente para o volume simulado do projeto
      # e a opcao de menor custo fixo (ver secao FinOps do README).
      ShardCount: 1
      StreamModeDetails:
        StreamMode: PROVISIONED
      RetentionPeriodHours: 24

  RoleLambdaConsumer:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NomeStream}-lambda-consumer"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Leitura do Kinesis + escrita de logs no CloudWatch
        - arn:aws:iam::aws:policy/service-role/AWSLambdaKinesisExecutionRole
      Policies:
        - PolicyName: s3-put-bronze-streaming
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                # Menor privilegio: escrita restrita ao prefixo de streaming
                Resource: !Sub "arn:aws:s3:::${NomeBucketDataLake}/bronze/alunos_streaming/*"

  FuncaoConsumer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NomeStream}-consumer"
      Description: Consome eventos de alfabetizacao do Kinesis e grava na bronze (S3).
      Runtime: python3.12
      Handler: consumer_lambda.handler
      Role: !GetAtt RoleLambdaConsumer.Arn
      Timeout: 60
      MemorySize: 512
      Layers:
        # Layer gerenciada da AWS com pandas + pyarrow
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:20"
      Environment:
        Variables:
          S3_BUCKET: !Ref NomeBucketDataLake
      Code:
        S3Bucket: !Ref CodigoS3Bucket
        S3Key: !Ref CodigoS3Key

  TriggerKinesis:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref FuncaoConsumer
      EventSourceArn: !GetAtt StreamAlfabetizacao.Arn
      StartingPosition: LATEST
      BatchSize: 100
      # Janela de 5s agrupa eventos proximos em um unico lote,
      # reduzindo invocacoes (custo) sem comprometer a latencia simulada.
      MaximumBatchingWindowInSeconds: 5

Outputs:
  StreamArn:
    Description: ARN do Kinesis Data Stream.
    Value: !GetAtt StreamAlfabetizacao.Arn

  FuncaoConsumerArn:
    Description: ARN do Lambda consumer.
    Value: !GetAtt FuncaoConsumer.Arn
